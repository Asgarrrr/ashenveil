name: constitution

# pull_request_target runs this file and the xtask code of the base branch,
# never the PR's: a PR cannot weaken the check that judges it (plan 0000, T4
# amendments). Never check out or execute the PR head here: it is only diffed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  constitution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      # Visibility only: the approval check below does not rely on this step,
      # since GitHub may cancel a pending run.
      - name: Drop the approval on a new push
        if: github.event.action == 'synchronize'
        run: |
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' \
              | grep -qx constitution-approved; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label constitution-approved
          fi
      # GITHUB_SHA is the current tip of main: its list and its xtask judge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the PR head as data
        run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
      # The label approves the head only if it was applied after GitHub
      # received that head: the first `pull_request` run of the head SHA marks
      # its arrival. A missing timestamp means no approval.
      - name: Check protected paths
        run: |
          labeled=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq '.labels[].name' | grep -x constitution-approved || true)
          approved_at=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "constitution-approved") | .created_at' \
            | tail -n 1)
          pushed_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD&event=pull_request&per_page=100" \
            --jq '[.workflow_runs[].created_at] | min // empty')
          echo "label present: ${labeled:-no}; labeled at: ${approved_at:-never}; head received at: ${pushed_at:-unknown}"
          flag=""
          if [ -n "$labeled" ] && [ -n "$approved_at" ] && [ -n "$pushed_at" ] \
              && [[ "$approved_at" > "$pushed_at" ]]; then
            flag=--approved
          fi
          cargo xtask constitution --base "$GITHUB_SHA" --head "$HEAD" $flag
