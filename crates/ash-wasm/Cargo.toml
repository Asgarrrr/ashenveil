[package]
name = "ash-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# cdylib for the WASM package, rlib for the host tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ash-protocol = { path = "../ash-protocol" }
# Pinned: the wasm-bindgen CLI must match this version exactly.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
