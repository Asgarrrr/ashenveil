[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
publish = false

# The common base. Every crate inherits it with `[lints] workspace = true`.
# A crate that inherits cannot extend it: the `ash-core` and `ash-sim` bans are
# crate-level attributes in their `lib.rs`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_conversions = "deny"
mod_module_files = "deny"

# An overflow in the simulation is a violated invariant, in release too. Set
# for the whole profile: generic code of `ash-core` or `ash-sim` takes the
# settings of the crate that instantiates it, so per-package overrides leak.
[profile.release]
overflow-checks = true
